<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar por PNR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #101828;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .search-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid #edf0f5;
      border-radius: 22px;
      box-shadow: 0 14px 35px rgba(16, 24, 40, 0.08);
      padding: 34px;
    }

    .icon-box {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: #fff4ed;
      color: #ff5a00;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    h1 {
      color: #111b2e;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .helper-text {
      color: #667085;
      font-size: 15px;
      line-height: 1.45;
      margin-bottom: 26px;
    }

    label {
      display: block;
      color: #344054;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      height: 54px;
      border-radius: 14px;
      border: 1px solid #d0d5dd;
      padding: 0 16px;
      font-size: 18px;
      font-weight: 700;
      color: #111b2e;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #ff5a00;
      box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.12);
    }

    input::placeholder {
      color: #98a2b3;
      font-weight: 600;
    }

    button {
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #ff5a00;
      color: #fff;
      padding: 0 24px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover {
      background: #e95100;
      transform: translateY(-1px);
    }

    .error-message {
      display: none;
      color: #b42318;
      background: #fff1f0;
      border: 1px solid #ffd7d3;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 14px;
    }

    .error-message.show {
      display: block;
    }

    @media (max-width: 520px) {
      .search-card {
        padding: 26px 20px;
      }

      .input-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="search-card" aria-label="Busca por PNR">
    <div class="icon-box" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
        <path d="M11 11V8.5C11 5.5 13.5 3 16.5 3h1C20.5 3 23 5.5 23 8.5V11" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        <rect x="7" y="11" width="20" height="17" rx="4" stroke="currentColor" stroke-width="2.3"/>
        <path d="M12 15v9M22 15v9" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Rastrear sua bagagem</h1>
    <p class="helper-text">O PNR está no canto superior direito do seu cartão de embarque.</p>

    <form id="pnrForm">
      <label for="pnr">PNR</label>
      <div class="input-group">
        <input
          id="pnr"
          name="pnr"
          type="text"
          placeholder="ABCDEF"
          maxlength="6"
          autocomplete="off"
          required
        />
        <button type="submit">Buscar</button>
      </div>

      <p id="errorMessage" class="error-message">Informe um PNR válido com 6 caracteres.</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('pnrForm');
    const input = document.getElementById('pnr');
    const errorMessage = document.getElementById('errorMessage');

    input.addEventListener('input', function () {
      this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '');
      errorMessage.classList.remove('show');
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const pnr = input.value.trim();

      if (pnr.length !== 6) {
        errorMessage.classList.add('show');
        input.focus();
        return;
      }

      window.location.href = `index-fluxo-mobile-sem-scroll.html?pnr=${encodeURIComponent(pnr)}`;
    });
  </script>
</body>
</html>
